[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filmgraph-backend"
version = "0.1.0"
description = "CLIO (Continuity & Lineage Intelligence Operator) backend and local data layer"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "clickhouse-connect>=0.8,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["filmgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
