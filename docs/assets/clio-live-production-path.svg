      <path d="M12 18.34a1.47 1.47 0 1 0 1.47 1.47A1.47 1.47 0 0 0 12 18.34Zm0 2.18a.72.72 0 1 1 .72-.71.71.71 0 0 1-.72.71Z" fill="#4285f4"/>
      <path d="M6 6.11a.76.76 0 0 1-.75-.75V3.48a.76.76 0 1 1 1.51 0v1.88A.76.76 0 0 1 6 6.11Z" fill="#aecbfa"/>
      <circle cx="5.98" cy="12" r=".76" fill="#aecbfa"/><circle cx="5.98" cy="9.79" r=".76" fill="#aecbfa"/><circle cx="5.98" cy="7.57" r=".76" fill="#aecbfa"/>
      <path d="M18 8.31a.76.76 0 0 1-.75-.76V5.67a.75.75 0 1 1 1.5 0v1.88a.75.75 0 0 1-.75.76Z" fill="#4285f4"/>
      <circle cx="18.02" cy="12.01" r=".76" fill="#4285f4"/><circle cx="18.02" cy="9.76" r=".76" fill="#4285f4"/><circle cx="18.02" cy="3.48" r=".76" fill="#4285f4"/>
      <path d="M12 15a.76.76 0 0 1-.75-.75v-1.91a.76.76 0 1 1 1.51 0v1.89A.76.76 0 0 1 12 15Z" fill="#669df6"/>
      <circle cx="12" cy="16.45" r=".76" fill="#669df6"/><circle cx="12" cy="10.14" r=".76" fill="#669df6"/><circle cx="12" cy="7.92" r=".76" fill="#669df6"/>
      <path d="M15 10.54a.76.76 0 0 1-.75-.75V7.91a.76.76 0 1 1 1.51 0v1.88a.76.76 0 0 1-.76.75Z" fill="#4285f4"/>
      <circle cx="15.01" cy="5.69" r=".76" fill="#4285f4"/><circle cx="15.01" cy="14.19" r=".76" fill="#4285f4"/><circle cx="15.01" cy="11.97" r=".76" fill="#4285f4"/>
      <circle cx="8.99" cy="14.19" r=".76" fill="#aecbfa"/><circle cx="8.99" cy="7.92" r=".76" fill="#aecbfa"/><circle cx="8.99" cy="5.69" r=".76" fill="#aecbfa"/>
      <path d="M9 12.73A.76.76 0 0 1 8.24 12V10.1a.75.75 0 1 1 1.5 0V12a.75.75 0 0 1-.74.73Z" fill="#aecbfa"/>
    </symbol>
    <symbol id="icon-secret-manager" viewBox="0 0 24 24">
      <path d="M22 6v12h-3.96a.19.19 0 0 1-.19-.19v-1.13a.19.19 0 0 1 .19-.19h2.45V7.51h-2.45a.19.19 0 0 1-.19-.19V6.19a.19.19 0 0 1 .19-.19H22Zm-15.69 0a.19.19 0 0 1 .19.19v1.13a.19.19 0 0 1-.19.19H3.51v8.87h2.78a.19.19 0 0 1 .19.19v1.13a.19.19 0 0 1-.19.19H2V6h4.31Zm11.12 3.87v1.46l.06.02 1.35-.48.28.82-1.36.47-.04.1.94 1.26-.71.51-.91-1.26h-.09l-.91 1.26-.71-.51.92-1.26-.02-.1-1.36-.47.28-.82 1.34.48.07-.03V9.87h.86Zm-10.23 0v1.44l.06.02 1.35-.47.28.81-1.36.46-.04.1.94 1.25-.71.51-.91-1.25h-.09l-.91 1.25-.71-.51.92-1.25-.02-.1-1.36-.46.28-.81 1.34.47.07-.02V9.87h.86Zm5.09 0v1.44l.06.02 1.35-.47.28.81-1.36.46-.04.1.94 1.25-.71.51-.91-1.25h-.09l-.91 1.25-.71-.51.92-1.25-.02-.1-1.36-.46.28-.81 1.34.47.07-.02V9.87h.86Z" fill="#4285f4"/>
    </symbol>
    <symbol id="icon-cloud-logging" viewBox="0 0 24 24">
      <rect x="6" y="11" width="4" height="2" fill="#4285f4"/><rect x="4" y="18" width="6" height="2" fill="#4285f4"/>
      <polygon points="4 18 6 18 6 6 4 6 4 18" fill="#4285f4"/>
      <polygon points="9 7 22 7 22 3 9 3 9 7" fill="#669df6"/><polygon points="9 14 22 14 22 10 9 10 9 14" fill="#669df6"/><polygon points="9 21 22 21 22 17 9 17 9 21" fill="#669df6"/>
      <polygon points="2 8 8 8 8 2 2 2 2 8" fill="#aecbfa"/>
    </symbol>
    <symbol id="icon-cloud-tasks" viewBox="0 0 24 24">
      <g fill="#669df6"><rect x="11" y="5" width="2" height="7"/><rect x="15" y="5" width="2" height="7"/><rect x="19" y="5" width="2" height="7"/><rect x="7" y="5" width="2" height="7"/><rect x="3" y="5" width="2" height="7"/></g>
      <g fill="#4285f4"><rect x="11" y="12" width="2" height="7"/><rect x="15" y="12" width="2" height="7"/><rect x="19" y="12" width="2" height="7"/><rect x="7" y="12" width="2" height="7"/><rect x="3" y="12" width="2" height="7"/></g>
    </symbol>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #172b4d; letter-spacing: -.7px; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #58708c; }
      .boundary-title { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1f3655; letter-spacing: .25px; }
      .zone-title { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #38516f; letter-spacing: .35px; }
      .node-title { font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1c3557; }
      .node-copy { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #58708c; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #45627f; }
      .tiny { font-family: Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #627a94; }
      .boundary { fill: #fbfdff; stroke: #7a93ae; stroke-width: 1.5; stroke-dasharray: 11 8; }
      .zone { fill: #ffffff; stroke: #bfd0e1; stroke-width: 1; stroke-dasharray: 5 4; }
      .node { fill: #ffffff; stroke: #b9cce0; stroke-width: 1.2; filter: url(#shadow); }
      .primary-card { fill: #f0fbfc; stroke: #00a7b5; stroke-width: 1.5; filter: url(#shadow); }
      .flow-primary { fill: none; stroke: #00a7b5; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 11 11; stroke-dashoffset: 22; marker-end: url(#arrow-primary); animation: march-to-target 1.25s linear infinite; }
      .flow-read { fill: none; stroke: #3b82f6; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 7; stroke-dashoffset: 14; marker-end: url(#arrow-read); animation: march-to-target-read 1s linear infinite; }
      @keyframes march-to-target { to { stroke-dashoffset: 0; } }
      @keyframes march-to-target-read { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow-primary, .flow-read { animation: none; } }
    </style>
  </defs>

  <rect width="1680" height="1050" fill="#f7faff"/>
  <text x="40" y="56" class="title">CLIO / LIVE PRODUCTION PATH</text>
  <text x="40" y="84" class="subtitle">Editor request → evidence service → human-approved screenplay change</text>

  <g transform="translate(1030 27)">
    <rect width="610" height="66" rx="10" fill="#ffffff" stroke="#bfd0e1"/>
    <path d="M24 31H92" class="flow-primary"/>
    <text x="110" y="35" class="label">Teal marching dashes: active flow, moving source → target</text>
    <path d="M24 50H92" class="flow-read"/>
    <text x="110" y="54" class="tiny">Blue marching dashes: read-only service call, source → target</text>
  </g>

  <rect x="40" y="150" width="280" height="740" rx="12" class="boundary"/>
  <rect x="350" y="150" width="960" height="740" rx="12" class="boundary"/>
  <rect x="1340" y="150" width="300" height="740" rx="12" class="boundary"/>
  <text x="62" y="180" class="boundary-title">EDITOR WORKSPACE</text>
  <text x="372" y="180" class="boundary-title">GOOGLE CLOUD / US-CENTRAL1</text>
  <text x="1362" y="180" class="boundary-title">DATA PROVIDER</text>

  <rect x="385" y="215" width="890" height="160" rx="8" class="zone"/>
  <text x="406" y="241" class="zone-title">PUBLIC EDGE</text>
  <rect x="385" y="400" width="890" height="270" rx="8" class="zone"/>
  <text x="406" y="426" class="zone-title">CLIO RUNTIME</text>
  <rect x="385" y="700" width="890" height="150" rx="8" class="zone"/>
  <text x="406" y="726" class="zone-title">SECURITY &amp; OBSERVABILITY</text>

  <g>
    <circle cx="180" cy="284" r="38" fill="#e9f6fb" stroke="#00a7b5" stroke-width="2"/>
    <path d="M160 281h40v25h-40zM170 316h20" fill="none" stroke="#00a7b5" stroke-width="3" stroke-linejoin="round"/>
    <text x="180" y="352" class="node-title" text-anchor="middle">Film editor</text>
    <rect x="78" y="384" width="204" height="115" rx="12" class="primary-card"/>
    <text x="100" y="416" class="node-title">CLIO workspace</text>
    <text x="100" y="440" class="node-copy">Revision · graph · trace</text>
    <text x="100" y="459" class="node-copy">Evidence stays reviewable</text>
    <text x="78" y="540" class="tiny">No service credentials in the browser.</text>
  </g>

  <g>
    <rect x="442" y="276" width="248" height="82" rx="12" class="primary-card"/>
    <path d="M470 296h32v22h-32zM478 326h16" fill="none" stroke="#00a7b5" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="520" y="308" class="node-title">Firebase Hosting</text>
    <text x="520" y="331" class="node-copy">Public client · /api route</text>
    <text x="442" y="385" class="tiny">Static workspace delivery</text>
  </g>

  <g>
    <rect x="590" y="478" width="220" height="126" rx="12" class="primary-card"/>
    <use href="#icon-cloud-run" x="616" y="505" width="52" height="52"/>
    <text x="684" y="519" class="node-title">Cloud Run</text>
    <text x="684" y="542" class="node-copy">API + approval gate</text>
    <text x="684" y="561" class="node-copy">Explicit changes</text>
  </g>

  <g>
    <rect x="990" y="455" width="220" height="116" rx="12" class="node"/>
    <use href="#icon-vertex-ai" x="1016" y="482" width="52" height="52"/>
    <text x="1082" y="495" class="node-title">Agent Runtime</text>
    <text x="1082" y="518" class="node-copy">Vertex AI service</text>
    <text x="1082" y="537" class="node-copy">No graph writes</text>
  </g>

  <g>
    <rect x="900" y="598" width="165" height="55" rx="12" class="node"/>
    <ellipse cx="922" cy="616" rx="9" ry="4" fill="#dbeafe" stroke="#669df6"/>
    <path d="M913 616v15c0 3 4 5 9 5s9-2 9-5v-15" fill="#eaf3ff" stroke="#669df6"/>
    <ellipse cx="922" cy="631" rx="9" ry="4" fill="#eaf3ff" stroke="#669df6"/>
    <text x="942" y="622" class="node-title">Memory Bank</text>
    <text x="942" y="640" class="tiny">durable context</text>
  </g>

  <g>
    <rect x="1075" y="598" width="135" height="55" rx="12" class="node"/>
    <use href="#icon-cloud-tasks" x="1088" y="611" width="24" height="24"/>
    <text x="1120" y="622" class="node-title">Cloud Tasks</text>
    <text x="1120" y="640" class="tiny">agent queue</text>
  </g>

  <g>
    <rect x="455" y="748" width="220" height="70" rx="12" class="node"/>
    <use href="#icon-secret-manager" x="481" y="765" width="36" height="36"/>
    <text x="532" y="778" class="node-title">Secret Manager</text>
    <text x="532" y="798" class="node-copy">Runtime-only credentials</text>
  </g>
  <g>
    <rect x="835" y="748" width="220" height="70" rx="12" class="node"/>
    <use href="#icon-cloud-logging" x="861" y="765" width="36" height="36"/>
    <text x="912" y="778" class="node-title">Cloud Logging</text>
    <text x="912" y="798" class="node-copy">Request and agent traces</text>
  </g>

  <g>
    <rect x="1380" y="405" width="220" height="108" rx="12" class="node"/>
    <g transform="translate(1398 431)">
      <rect x="0" y="8" width="5" height="25" fill="#ffcc01"/><rect x="7" y="4" width="5" height="29" fill="#ffcc01"/>
      <rect x="14" y="0" width="5" height="33" fill="#ffcc01"/><rect x="21" y="4" width="5" height="29" fill="#ffcc01"/>
      <rect x="28" y="8" width="5" height="25" fill="#ffcc01"/><rect x="0" y="35" width="5" height="5" fill="#ff3b30"/>
    </g>
    <text x="1453" y="444" class="node-title">ClickHouse Cloud</text>
    <text x="1453" y="467" class="node-copy">Screenplay graph</text>
    <text x="1453" y="486" class="node-copy">Primary data source</text>
  </g>
  <path d="M282 441H350V317H442" class="flow-primary"/>
  <text x="304" y="425" class="label">HTTPS</text>
  <path d="M566 358V440H700V478" class="flow-primary"/>
  <text x="580" y="426" class="label">/api request</text>
  <path d="M810 524H990" class="flow-primary"/>
  <text x="846" y="509" class="label">agent run</text>
  <path d="M990 552H810" class="flow-read"/>
  <text x="849" y="574" class="label">read-only tools</text>
  <path d="M810 578H1330V459H1380" class="flow-primary"/>
  <path d="M675 783V724H700V604" class="flow-read"/>
  <text x="584" y="714" class="label">server-only secrets</text>
  <path d="M810 590V724H945V748" class="flow-read"/>
  <text x="832" y="714" class="label">structured logs</text>
  <path d="M810 604V665H1142V653" class="flow-read"/>
  <text x="916" y="657" class="tiny">queue run</text>
  <path d="M1142 598V571" class="flow-primary"/>
  <text x="1116" y="588" class="tiny">dispatch</text>
  <path d="M1042 571V598" class="flow-primary"/>

  <rect x="40" y="925" width="1600" height="72" rx="10" fill="#ffffff" stroke="#bfd0e1"/>
  <text x="64" y="955" class="node-title">Human approval is the write boundary.</text>
  <text x="64" y="977" class="node-copy">CLIO gathers graph, timing, and revision evidence; an editor decides whether the screenplay map changes.</text>
  <text x="1570" y="972" text-anchor="end" class="tiny">Google Cloud product icons: legacy collection</text>
</svg>
