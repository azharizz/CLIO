<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1050" role="img" aria-labelledby="title desc">
  <title id="title">CLIO live production path</title>
  <desc id="desc">An animated architecture diagram showing the editor workspace, Firebase Hosting, Cloud Run, Vertex AI Agent Runtime, Memory Bank, Cloud Tasks, Secret Manager, Cloud Logging, and ClickHouse Cloud. Every dashed connector marches from its source toward its target.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#10213b" flood-opacity=".11"/>
    </filter>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00a7b5"/>
    </marker>
    <marker id="arrow-read" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b82f6"/>
    </marker>
    <symbol id="icon-cloud-run" viewBox="0 0 24 24">
      <polygon fill="#aecbfa" points="8.9 2.63 12.02 12 21.38 12 8.9 2.63"/>
      <polygon fill="#4285f4" points="21.38 12 12.02 12 8.9 21.38 21.38 12"/>
      <polygon fill="#4285f4" points="3.44 21.38 6.57 19.81 8.9 12 5.78 12 3.44 21.38"/>
      <polygon fill="#aecbfa" points="3.44 2.63 5.78 12 8.9 12 6.57 4.19 3.44 2.63"/>
    </symbol>
